<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Producto - UNDETIX</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div id="header-container"></div>

    <main id="main-content">
        <div class="product-detail-container">
            <div class="product-detail-img">
                <img id="img" src="" alt="Imagen del producto seleccionado">
            </div>
            <div class="product-detail-info">
                <h1 id="titulo" style="font-size: 32px; margin-bottom: 20px; font-family: serif;"></h1>
                <p style="font-size: 24px; font-weight: bold; margin-bottom: 20px;" aria-label="Precio">31 €</p>

                <div class="mb-4">
                    <label for="talla" class="form-label" style="font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Talla</label>
                    <select id="talla" class="form-select form-select-sm" style="max-width: 120px;" aria-label="Seleccionar talla">
                        <option value="">-- Elige --</option>
                        <option value="XS">XS</option>
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                    </select>
                </div>

                <p style="line-height: 1.6; margin-bottom: 30px; color: #666;">
                    Este producto es un ejemplo de la calidad premium de UNDETIX. Confeccionado con materiales sostenibles y diseñado para durar.
                </p>
                <button class="btn-black" aria-label="Añadir este producto a la cesta">AÑADIR A LA CESTA</button>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        $(document).ready(function() {
            $("#header-container").load("fragments/header.html", function() {
                $(document).on('click', '#menuToggle', function() {
                    var expanded = $(this).attr('aria-expanded') === 'true';
                    $(this).toggleClass('open').attr('aria-expanded', !expanded);
                    $('#mega-menu').toggleClass('active').attr('aria-hidden', expanded);
                });
                $(document).on('click keypress', '.cat-item', function(e) {
                    if (e.type === 'click' || e.which === 13) {
                        $('.cat-item').removeClass('active-cat').attr('aria-selected', 'false');
                        $(this).addClass('active-cat').attr('aria-selected', 'true');
                        var targetList = $(this).data('target');
                        $('.sub-list').removeClass('active-list');
                        $('#' + targetList).hide().addClass('active-list').fadeIn(200);
                    }
                });
            });
            $("#footer-container").load("fragments/footer.html");

            var params = new URLSearchParams(window.location.search);
            var prod = params.get("producto");

            if (prod === "blanco") {
                $("#titulo").text("Pantalón de pana blanco");
                $("#img").attr("src", "imagenes/pantalon.jpg").attr("alt", "Pantalón de pana blanco UNDETIX");
            } else if (prod === "azul") {
                $("#titulo").text("Pantalón de pana azul");
                $("#img").attr("src", "imagenes/pantalon2.jpg").attr("alt", "Pantalón de pana azul UNDETIX");
            } else {
                $("#titulo").text("Producto no encontrado");
                $("#img").attr("alt", "Producto no disponible");
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - UNDETIX</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div id="header-container"></div>

    <main id="main-content">
        <h1 class="page-title">CONTACTO</h1>

        <div class="contact-container">
            <div class="contact-top-section">
                <div class="form-column">
                    <form id="miFormulario" novalidate aria-label="Formulario de contacto">
                        <div class="form-group">
                            <label for="nombre">Nombre</label>
                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                placeholder="Tu nombre completo"
                                required
                                aria-required="true"
                                autocomplete="name">
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="tucorreo@ejemplo.com"
                                required
                                aria-required="true"
                                autocomplete="email">
                        </div>

                        <div class="form-group">
                            <label for="mensaje">Mensaje</label>
                            <textarea
                                id="mensaje"
                                name="mensaje"
                                placeholder="¿En qué podemos ayudarte?"
                                required
                                aria-required="true"></textarea>
                        </div>

                        <button type="submit" class="btn-contact" aria-label="Enviar mensaje de contacto">ENVIAR MENSAJE</button>
                    </form>
                </div>

                <div class="logo-column">
                    <img src="imagenes/chaqueta-Mujer.jpg" alt="Modelo con abrigo UNDETIX" class="logo-contact-img">
                </div>
            </div>

            <div class="map-section">
                <h2 class="section-title" style="text-align: center; margin-bottom: 40px;">ENCUÉNTRANOS</h2>
                <div class="map-container" aria-label="Mapa de localización de UNDETIX en Madrid">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3037.123456789!2d-3.703790!3d40.416775!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd42288000000001%3A0x0000000000000000!2sMadrid!5e0!3m2!1ses!2ses!4v1600000000000!5m2!1ses!2ses"
                        title="Mapa de ubicación de UNDETIX en Madrid"
                        allowfullscreen=""
                        loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        $(document).ready(function() {
            $("#header-container").load("fragments/header.html", function() {
                $(document).on('click', '#menuToggle', function() {
                    var expanded = $(this).attr('aria-expanded') === 'true';
                    $(this).toggleClass('open').attr('aria-expanded', !expanded);
                    $('#mega-menu').toggleClass('active').attr('aria-hidden', expanded);
                });
                $(document).on('click keypress', '.cat-item', function(e) {
                    if (e.type === 'click' || e.which === 13) {
                        $('.cat-item').removeClass('active-cat').attr('aria-selected', 'false');
                        $(this).addClass('active-cat').attr('aria-selected', 'true');
                        var targetList = $(this).data('target');
                        $('.sub-list').removeClass('active-list');
                        $('#' + targetList).hide().addClass('active-list').fadeIn(200);
                    }
                });
            });
            $("#footer-container").load("fragments/footer.html");

            $("#miFormulario").on('submit', function(e) {
                e.preventDefault();
                var nombre = $('#nombre').val().trim();
                var email = $('#email').val().trim();
                var mensaje = $('#mensaje').val().trim();
                if (!nombre || !email || !mensaje) {
                    alert('Por favor, rellena todos los campos antes de enviar.');
                    return;
                }
                alert('¡Mensaje enviado! Nos pondremos en contacto contigo pronto.');
                this.reset();
            });
        });
    </script>
</body>
</html>

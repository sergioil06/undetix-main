<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrigos Hombre - UNDETIX</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="style/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div id="header-container"></div>

    <main id="main-content">
        <h1 class="page-title">CHAQUETAS HOMBRE</h1>

        <div class="catalog-container">
            <div id="tabs-abrigos-hombre">
                <ul>
                    <li><a href="#tab-bs-ah">Best Selling</a></li>
                    <li><a href="#tab-todos-ah">Todos los productos</a></li>
                </ul>

                <div id="tab-bs-ah">
                    <div class="row g-4 mt-2">
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/chaqueta.jpg" alt="Abrigo de lana para hombre"></a>
                                <p class="prod-name">Abrigo Lana</p>
                                <p class="prod-price">49,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/chaqueta.jpg" alt="Cazadora bomber para hombre"></a>
                                <p class="prod-name">Cazadora Bomber</p>
                                <p class="prod-price">49,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/chaqueta.jpg" alt="Parka impermeable para hombre"></a>
                                <p class="prod-name">Parka Impermeable</p>
                                <p class="prod-price">59,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="tab-todos-ah">
                    <div class="row g-4 mt-2">
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/chaqueta.jpg" alt="Gabardina clásica para hombre"></a>
                                <p class="prod-name">Gabardina Clásica</p>
                                <p class="prod-price">89,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/chaqueta.jpg" alt="Chaqueta denim para hombre"></a>
                                <p class="prod-name">Chaqueta Denim</p>
                                <p class="prod-price">39,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/chaqueta.jpg" alt="Chaleco acolchado para hombre"></a>
                                <p class="prod-name">Chaleco Acolchado</p>
                                <p class="prod-price">35,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/chaqueta.jpg" alt="Blazer casual para hombre"></a>
                                <p class="prod-name">Blazer Casual</p>
                                <p class="prod-price">55,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        $(document).ready(function() {
            $("#header-container").load("fragments/header.html", function() {
                $(document).on('click', '#menuToggle', function() {
                    var expanded = $(this).attr('aria-expanded') === 'true';
                    $(this).toggleClass('open').attr('aria-expanded', !expanded);
                    $('#mega-menu').toggleClass('active').attr('aria-hidden', expanded);
                });
                $(document).on('click keypress', '.cat-item', function(e) {
                    if (e.type === 'click' || e.which === 13) {
                        $('.cat-item').removeClass('active-cat').attr('aria-selected', 'false');
                        $(this).addClass('active-cat').attr('aria-selected', 'true');
                        var targetList = $(this).data('target');
                        $('.sub-list').removeClass('active-list');
                        $('#' + targetList).hide().addClass('active-list').fadeIn(200);
                    }
                });
            });
            $("#footer-container").load("fragments/footer.html");
            $("#tabs-abrigos-hombre").tabs();
        });
    </script>
</body>
</html>

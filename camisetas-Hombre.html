<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camisetas Hombre - UNDETIX</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="style/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div id="header-container"></div>

    <main id="main-content">
        <h1 class="page-title">CAMISETAS HOMBRE</h1>

        <div class="catalog-container">
            <div id="tabs-camisetas-hombre">
                <ul>
                    <li><a href="#tab-bs-ch">Best Selling</a></li>
                    <li><a href="#tab-todos-ch">Todos los productos</a></li>
                </ul>

                <div id="tab-bs-ch">
                    <div class="row g-4 mt-2">
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/camiseta.jpg" alt="Camiseta básica de hombre"></a>
                                <p class="prod-name">Camiseta Básica</p>
                                <p class="prod-price">29,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/camiseta.jpg" alt="Camiseta con logo de hombre"></a>
                                <p class="prod-name">Camiseta Logo</p>
                                <p class="prod-price">29,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/camiseta.jpg" alt="Camiseta estampada de hombre"></a>
                                <p class="prod-name">Camiseta Estampada</p>
                                <p class="prod-price">29,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/camiseta.jpg" alt="Camiseta vintage de hombre"></a>
                                <p class="prod-name">Camiseta Vintage</p>
                                <p class="prod-price">29,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="tab-todos-ch">
                    <div class="row g-4 mt-2">
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/camiseta.jpg" alt="Camiseta de manga larga para hombre"></a>
                                <p class="prod-name">Camiseta Manga Larga</p>
                                <p class="prod-price">35,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/camiseta.jpg" alt="Polo piqué de hombre"></a>
                                <p class="prod-name">Polo Piqué</p>
                                <p class="prod-price">39,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/camiseta.jpg" alt="Camiseta oversize de hombre"></a>
                                <p class="prod-name">Camiseta Oversize</p>
                                <p class="prod-price">29,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/camiseta.jpg" alt="Camiseta de rayas de hombre"></a>
                                <p class="prod-name">Camiseta Rayas</p>
                                <p class="prod-price">29,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        $(document).ready(function() {
            $("#header-container").load("fragments/header.html", function() {
                $(document).on('click', '#menuToggle', function() {
                    var expanded = $(this).attr('aria-expanded') === 'true';
                    $(this).toggleClass('open').attr('aria-expanded', !expanded);
                    $('#mega-menu').toggleClass('active').attr('aria-hidden', expanded);
                });
                $(document).on('click keypress', '.cat-item', function(e) {
                    if (e.type === 'click' || e.which === 13) {
                        $('.cat-item').removeClass('active-cat').attr('aria-selected', 'false');
                        $(this).addClass('active-cat').attr('aria-selected', 'true');
                        var targetList = $(this).data('target');
                        $('.sub-list').removeClass('active-list');
                        $('#' + targetList).hide().addClass('active-list').fadeIn(200);
                    }
                });
            });
            $("#footer-container").load("fragments/footer.html");
            $("#tabs-camisetas-hombre").tabs();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalones Hombre - UNDETIX</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="style/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div id="header-container"></div>

    <main id="main-content">
        <h1 class="page-title">PANTALONES HOMBRE</h1>

        <div class="catalog-container">
            <div id="tabs-pantalones-hombre">
                <ul>
                    <li><a href="#tab-bs-ph">Best Selling</a></li>
                    <li><a href="#tab-todos-ph">Todos los productos</a></li>
                </ul>

                <div id="tab-bs-ph">
                    <div class="row g-4 mt-2">
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html?producto=blanco"><img src="imagenes/pantalon.jpg" alt="Pantalón de pana blanco para hombre"></a>
                                <p class="prod-name">Pantalón Pana</p>
                                <p class="prod-price">29,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html?producto=azul"><img src="imagenes/pantalon2.jpg" alt="Jeans azul para hombre"></a>
                                <p class="prod-name">Jeans Azul</p>
                                <p class="prod-price">29,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/pantalon3.jpg" alt="Chino beige para hombre"></a>
                                <p class="prod-name">Chino Beige</p>
                                <p class="prod-price">25,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="tab-todos-ph">
                    <div class="row g-4 mt-2">
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/pantalon4.jpg" alt="Cargo negro para hombre"></a>
                                <p class="prod-name">Cargo Negro</p>
                                <p class="prod-price">39,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/pantalon.jpg" alt="Pantalón de pana para hombre"></a>
                                <p class="prod-name">Pantalón Pana</p>
                                <p class="prod-price">29,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/pantalon2.jpg" alt="Jeans azul para hombre"></a>
                                <p class="prod-name">Jeans Azul</p>
                                <p class="prod-price">29,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="product-card">
                                <a href="product.html"><img src="imagenes/pantalon3.jpg" alt="Pantalón recto gris para hombre"></a>
                                <p class="prod-name">Recto Gris</p>
                                <p class="prod-price">27,99 EUR</p>
                                <button>Buy now</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        $(document).ready(function() {
            $("#header-container").load("fragments/header.html", function() {
                $(document).on('click', '#menuToggle', function() {
                    var expanded = $(this).attr('aria-expanded') === 'true';
                    $(this).toggleClass('open').attr('aria-expanded', !expanded);
                    $('#mega-menu').toggleClass('active').attr('aria-hidden', expanded);
                });
                $(document).on('click keypress', '.cat-item', function(e) {
                    if (e.type === 'click' || e.which === 13) {
                        $('.cat-item').removeClass('active-cat').attr('aria-selected', 'false');
                        $(this).addClass('active-cat').attr('aria-selected', 'true');
                        var targetList = $(this).data('target');
                        $('.sub-list').removeClass('active-list');
                        $('#' + targetList).hide().addClass('active-list').fadeIn(200);
                    }
                });
            });
            $("#footer-container").load("fragments/footer.html");
            $("#tabs-pantalones-hombre").tabs();
        });
    </script>
</body>
</html>
